version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlantis-postgres
    environment:
      POSTGRES_DB: atlantis
      POSTGRES_USER: atlantis_user
      POSTGRES_PASSWORD: atlantis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlantis_user -d atlantis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: