spring:
  application:
    name: atlantis
  datasource:
    url: jdbc:postgresql://localhost:5432/atlantis
    username: atlantis_user
    password: atlantis_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

server:
  port: 8080

vaadin:
  allowed-packages: com.atlantis.frontend

logging:
  level:
    com.atlantis: INFO
    org.springframework.web: INFO
    liquibase: INFO
    org.hibernate.SQL: DEBUG